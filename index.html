<symbol id="i-syringe" viewBox="0 0 24 24"><path d="M17.5 3.5l3 3M19 5l-3.5 3.5M13 6.5l4.5 4.5M15.2 8.8l-8.4 8.4H4.8v-2l8.4-8.4M9.5 10.5l1.5 1.5M7.5 12.5l1.5 1.5M3.5 20.5l1.3-1.3"/></symbol>
<symbol id="i-vial" viewBox="0 0 24 24"><path d="M9 3.5h6M10 3.5v5.2l-4.6 7.9A2.9 2.9 0 0 0 7.9 21h8.2a2.9 2.9 0 0 0 2.5-4.4L14 8.7V3.5M7.3 14.5h9.4"/></symbol>
<symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9.5 3.5h5v2.8h-5zM9 6.3h6l1.5 2.7v9.5a2.5 2.5 0 0 1-2.5 2.5h-4a2.5 2.5 0 0 1-2.5-2.5V9zM7.5 12.5h9"/></symbol>

<symbol id="i-tube" viewBox="0 0 24 24"><path d="M8 3.5h8M9 3.5v3.2l-1 1.3V19a1.5 1.5 0 0 0 1.5 1.5h5A1.5 1.5 0 0 0 16 19V8l-1-1.3V3.5M8 12.5h8"/></symbol>

<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>

<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10zM13.5 6.5l4 4"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L11 13M17.5 14v3.5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2H10"/></symbol>
<symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.3 4.9L3.6 17a2 2 0 0 0 1.7 3h13.4a2 2 0 0 0 1.7-3L13.7 4.9a2 2 0 0 0-3.4 0zM12 9.5v4M12 16.8h.01"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3.5"/><rect x="8" y="6" width="8" height="3.5" rx="1"/><path d="M8.8 13.5h.01M12 13.5h.01M15.2 13.5h.01M8.8 17h.01M12 17h.01M15.2 17h.01"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9zM18.5 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
<symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7 2.8v5.2c0 4.3-2.9 7.7-7 9-4.1-1.3-7-4.7-7-9V6.3z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M9.5 4.5h5v5h5v5h-5v5h-5v-5h-5v-5h5z"/></symbol>

<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
<symbol id="i-percent" viewBox="0 0 24 24"><path d="M6.5 17.5l11-11"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/></symbol>
<symbol id="i-enter" viewBox="0 0 24 24"><path d="M19.5 5v6.5a3 3 0 0 1-3 3H5M9 10.5l-4 4 4 4"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></symbol>
<symbol id="i-tray" viewBox="0 0 24 24"><path d="M4 13.5l2.2-7.1A2 2 0 0 1 8.1 5h7.8a2 2 0 0 1 1.9 1.4l2.2 7.1V17a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17zM4 13.5h4.5l1 2h5l1-2H20"/></symbol>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3.2c-2.3 3.2-6.8 5.2-6.8 9.8a6.8 6.8 0 0 0 13.6 0c0-4.6-4.5-6.6-6.8-9.8z" fill="url(#lxGrad)" stroke="none"/><path d="M9.3 13.6a2.8 2.8 0 0 0 2.7 2.6" stroke="rgba(10,20,40,.55)"/></symbol>
</svg>

<div id="lxPreloader" aria-hidden="true">
<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--preloader-track)" stroke-width="2"/><circle id="lxRing" cx="60" cy="60" r="46" fill="none" stroke="url(#lxGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="66 224"/><g id="lxCore"><circle cx="60" cy="60" r="18" fill="url(#lxGrad)" opacity="0.14"/><path d="M60 44c-5 7-16 11-16 21a16 16 0 0 0 32 0c0-10-11-14-16-21z" fill="url(#lxGrad)"/></g></svg>
</div>

<div class="ambient" aria-hidden="true"></div>

<header class="topbar" id="topbar">
<a class="brand" href="./" aria-label="LX Search home">
<svg class="brand-mark"><use href="#i-logo"/></svg>
<span class="brand-text">LX Search<span class="brand-ver">5</span></span>
</a>
<nav class="dock" aria-label="App controls">
<button class="dock-btn palette-trigger" data-action="open-cmdk" title="Command palette" aria-label="Open command palette">
<svg class="ic"><use href="#i-command"/></svg><span class="kbd-inline" id="cmdkHint">K</span>
</button>
<span class="dock-sep"></span>
<button class="dock-btn" id="themeBtn" data-action="cycle-theme" aria-label="Toggle theme"><svg class="ic"><use id="themeIconUse" href="#i-auto"/></svg></button>
<button class="dock-btn" data-action="open-file-upload" title="Import order (.json)" aria-label="Import order"><svg class="ic"><use href="#i-upload"/></svg></button>
<div class="menu-anchor">
<button class="dock-btn" id="engineBtn" data-action="toggle-engine-menu" title="Web search engine" aria-label="Web search engine" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-globe"/></svg></button>
<div class="menu" id="engineMenu" role="menu"></div>
</div>
<input type="file" id="fileUpload" accept=".json,application/json" hidden>
</nav>
</header>

<div class="shell" id="shell">
<main class="finder" id="finder">
<div class="finder-head" id="finderHead">
<div class="omnibar" id="omnibar">
<svg class="ic omni-lead" id="omniLead"><use href="#i-search"/></svg>
<input type="text" id="omniInput" class="omni-input" placeholder="Search medicines or type concor 5 x30" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Search medicines" role="combobox" aria-expanded="true" aria-haspopup="listbox" aria-autocomplete="list" aria-controls="resultsList">
<label class="omni-price" id="omniPriceWrap" hidden><span>@</span><input type="number" inputmode="decimal" id="omniPriceInput" placeholder="Supply price" aria-label="Supply price" min="0"></label>
<button class="omni-btn" id="omniClear" data-action="clear-input" aria-label="Clear search" hidden><svg class="ic"><use href="#i-x"/></svg></button>
</div>
<div class="hint" id="omniHint" aria-live="polite"></div>
<div class="toolbar" id="toolbar">
<div class="seg type-seg" id="typeSeg" role="radiogroup" aria-label="Calculation type"></div>
<div class="toolbar-chips" id="facetChips"></div>
<div class="toolbar-end">
<div class="seg mode-seg" role="radiogroup" aria-label="Add quantities as">
<button class="seg-btn" data-action="set-add-mode" data-id="unit" role="radio" id="modeUnit"><svg class="ic"><use href="#i-ruler"/></svg><span>Units</span></button>
<button class="seg-btn" data-action="set-add-mode" data-id="pack" role="radio" id="modePack"><svg class="ic"><use href="#i-box"/></svg><span>Packs</span></button>
</div>
</div>
</div>
</div>
<div class="results-meta" id="resultsMeta" aria-live="polite"></div>
<div class="results" id="resultsList" role="listbox" aria-label="Search results"></div>
</main>

<aside class="tray" id="tray" aria-label="Calculation tray">
<div class="tray-card">
<header class="tray-head">
<div class="tray-title-wrap">
<input class="tray-title" id="trayTitle" value="Current calculation" maxlength="60" aria-label="Order name" spellcheck="false">
<span class="status" id="trayStatus">Unsaved</span>
</div>
<button class="icon-btn tray-close" data-action="close-tray" aria-label="Close tray"><svg class="ic"><use href="#i-chev-down"/></svg></button>
</header>
<div class="orders" id="ordersBar" aria-label="Saved orders"></div>
<div class="tray-lines" id="trayLines"></div>
<footer class="tray-foot" id="trayFoot">
<div class="total-row">
<div><div class="total-label">Total</div><div class="total-sub" id="traySub">0 items</div></div>
<div class="total-val" id="trayTotal">0.00 <small>EGP</small></div>
</div>
<div class="tray-actions">
<button class="pill-btn ghost" data-action="clear-tray" title="Clear"><svg class="ic"><use href="#i-trash"/></svg><span>Clear</span></button>
<button class="pill-btn ghost" data-action="copy-tray" title="Copy summary"><svg class="ic"><use href="#i-copy"/></svg><span>Copy</span></button>
<button class="pill-btn ghost" data-action="download-json" title="Download .json"><svg class="ic"><use href="#i-download"/></svg><span>JSON</span></button>
<button class="pill-btn ghost" data-action="download-csv" title="Download .csv"><svg class="ic"><use href="#i-table"/></svg><span>CSV</span></button>
<button class="pill-btn primary" id="saveOrderBtn" data-action="save-order"><svg class="ic"><use href="#i-save"/></svg><span>Save order</span></button>
</div>
</footer>
</div>
</aside>
</div>

<button class="tray-bar" id="trayBar" data-action="open-tray" aria-label="Open calculation tray">
<span class="tray-bar-icon"><svg class="ic"><use href="#i-calc"/></svg><span class="count" id="trayBarCount">0</span></span>
<span class="tray-bar-text"><span class="tray-bar-label">Calculation</span><span class="tray-bar-total" id="trayBarTotal">0.00 EGP</span></span>
<svg class="ic"><use href="#i-chev-right"/></svg>
</button>

<div class="scrim" id="scrim" data-action="close-tray"></div>

<div class="modal" id="detailModal" aria-hidden="true">
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1"></div>
</div>

<div class="cmdk" id="cmdk" aria-hidden="true">
<div class="cmdk-panel" id="cmdkPanel" role="dialog" aria-modal="true" aria-label="Command palette">
<div class="cmdk-input-row">
<svg class="ic"><use href="#i-bolt"/></svg>
<input type="text" id="cmdkInput" class="cmdk-input" placeholder="Medicines, commands, orders… try concor 5 x30" autocomplete="off" spellcheck="false" aria-label="Search medicines or run a command">
<kbd>Esc</kbd>
</div>
<div class="cmdk-body">
<div class="cmdk-list" id="cmdkList" role="listbox" aria-label="Palette results"></div>
<div class="cmdk-pane" id="cmdkPane"></div>
</div>
</div>
</div>

<div class="popover" id="popover" role="menu"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/palette.js"></script>
<script src="js/app.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>
