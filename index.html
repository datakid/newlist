s = s.slice(0, priceMatch.index) + ' ' + s.slice(priceMatch.index + priceMatch[0].length);
}

if (qtyMatch) {
const n = parseFloat(qtyMatch[1].replace(',', '.'));
s = s.slice(0, qtyMatch.index);
if (n > 0) {
intent.qty = Math.min(n, MAX_QTY);

} else {
intent.qtyInvalid = true;
}

};

const hashStr = (s) => { let h = 5381; for(let k = 0; k < s.length; k++) { h = ((h << 5) + h) + s.charCodeAt(k); h |= 0; } return (h >>> 0).toString(36); };
const makeStableId = (name, unit, company) => `${slugify(name) || 'item'}-${hashStr(`${name}|${unit}|${company}`)}`;

const getIconForUnit = (unitStr) => {
const u = unitStr.toLowerCase();
if (u.includes('tab') || u.includes('cap')) return 'pill';
if (u.includes('pen') || u.includes('cartridge')) return 'syringe';
if (u.includes('vial')) return 'vaccines';
if (u.includes('bottle')) return 'medication';
if (u.includes('spray') || u.includes('inhaler')) return 'air';
return 'medical_services';
};

const migrateEntries = (entries) => {
if (!Array.isArray(entries)) return [];
const migrated = [];
entries.forEach(entry => {
if (!Array.isArray(entry) || entry.length !== 2 || !entry[1] || !entry[1].item) return;
const val = entry[1];
const match = db.find(d => d.n === val.item.n && d.u === val.item.u && d.s === val.item.s && d.t === val.item.t);
if (!match) return;
migrated.push([match.id, { ...val, item: match }]);
});
return migrated;
};

const getFocusable = (container) => Array.from(container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.getClientRects().length > 0);
let focusTrapContainer = null;
let focusTrapHandler = null;
const trapFocus = (container) => {
releaseFocusTrap();
if (!container) return;
focusTrapContainer = container;
focusTrapHandler = (e) => {
if (e.key !== 'Tab') return;
const focusable = getFocusable(container);
if (!focusable.length) return;
const first = focusable[0], last = focusable[focusable.length - 1];
if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
};
container.addEventListener('keydown', focusTrapHandler);
};
const releaseFocusTrap = () => {
if (focusTrapContainer && focusTrapHandler) focusTrapContainer.removeEventListener('keydown', focusTrapHandler);
focusTrapContainer = null; focusTrapHandler = null;
};

const legacyCopy = (text) => {
try {
const ta = document.createElement('textarea');
ta.value = text;
ta.setAttribute('readonly', '');
ta.style.position = 'fixed';
ta.style.opacity = '0';
ta.style.left = '-9999px';
document.body.appendChild(ta);
ta.focus(); ta.select();
const ok = document.execCommand('copy');
document.body.removeChild(ta);
return ok;
} catch(e) { return false; }
};
const copyTextToClipboard = (text) => new Promise((resolve) => {
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text).then(() => resolve(true)).catch(() => resolve(legacyCopy(text)));
} else {
resolve(legacyCopy(text));
}
});

filtered.forEach(item => {

const wrapper = document.createElement('div');
wrapper.innerHTML = cardTemplate(item, qTokens, isPack).trim();

if (el.getAttribute('aria-label') !== fresh.getAttribute('aria-label')) el.setAttribute('aria-label', fresh.getAttribute('aria-label'));
} else {
el = fresh;
}
if (el === ref) ref = ref.nextSibling;
else els.res.insertBefore(el, ref);
});

let node = ref;
while (node) { const next = node.nextSibling; node.remove(); node = next; }
};

const u = els.fU.value, s = els.fS.value;

syncFilterTriggerUI('fUnit');
syncFilterTriggerUI('fSource');

let filtered = [];
for(let i=0; i<db.length; i++) {
const item = db[i];
if(u !== 'all' && item.u !== u) continue;
if(s !== 'all' && item.s !== s) continue;

let score = 0;
if(qTokens.length > 0) {
let matchedAll = true;
for(let j=0; j<qTokens.length; j++) {
const tk = qTokens[j];
const aliasTk = resolveAliasToken(tk);
const hit = item.searchStr.includes(tk) || (aliasTk !== tk && item.searchStr.includes(aliasTk));
if(!hit) { matchedAll = false; break; }
if(item.nLower.startsWith(tk)) score += 20; else score += 10;
}
if(!matchedAll) continue;
}
filtered.push({...item, score});
}
if(qTokens.length > 0) filtered.sort((a,b) => b.score - a.score);

currentResults = filtered;
const isPack = globalAddMode === 'pack';
const rawTokens = rawQ.toLowerCase().trim().split(/\s+/).filter(Boolean);
reconcileResultsList(filtered, rawTokens, isPack);
updateResultsMeta();

selectionIndex = -1;
applySelection();
};

const commitToCalc = (id, req, sp = 0, additive = false) => {
const item = db.find(i => i.id === id);
if (!item) return null;
const existing = dashboardMap.get(id);
const totalReq = additive && existing ? existing.req + req : req;
const { packs, spare } = packInfo(totalReq, item.bQty);
const costP = item.isDynamic ? packs * Math.round(toPiastres(sp) / 2) : packs * item.pP;
const cost = costP / 100;
dashboardMap.set(id, { item, req: totalReq, packs, cost, supplyPrice: sp });
syncCurrentOrder();
els.badge.classList.add('pop'); els.badge.style.display = 'block'; els.badge.textContent = dashboardMap.size;
setTimeout(() => els.badge.classList.remove('pop'), 200);
if(activeView === 'calc') renderDashboard();
return { item, packs, cost, spare };
};

const resolveTarget = (intent) => {
const qStr = normalizeSearchText(intent.query);
if (!qStr) return null;
const qTokens = qStr.split(/\s+/).filter(Boolean);
let best = null, bestScore = -1;
for (let i = 0; i < db.length; i++) {
const item = db[i];
let score = 0, matchedAll = true;
for (let j = 0; j < qTokens.length; j++) {
const tk = qTokens[j];
const aliasTk = resolveAliasToken(tk);
const hit = item.searchStr.includes(tk) || (aliasTk !== tk && item.searchStr.includes(aliasTk));
if (!hit) { matchedAll = false; break; }
if (item.nLower.startsWith(tk)) score += 20; else score += 10;
}
if (!matchedAll) continue;
if (score > bestScore) { bestScore = score; best = item; }
}
return best ? { item: best, score: bestScore } : null;
};

const preview = (intent, target) => {
if (!intent.query) return { text: 'Type a medicine name · x30 sets quantity · ⌘K for commands', ok: false };
if (intent.qtyInvalid) return { text: 'Quantity must be greater than 0', ok: false };
if (!target) return { text: `No match for "${intent.query}"`, ok: false };
const item = target.item;
if (intent.qty == null) {
const priceStr = item.isDynamic ? '50% Supply Price' : `${item.p.toFixed(2)} EGP`;
return { text: `⏎ ${item.n} · ${item.u} · ${priceStr}`, ok: true };
}
if (item.isDynamic && intent.price == null) {
return { text: `${item.n} needs a supply price — type @450 or press Tab`, ok: false };
}
const { packs, spare } = packInfo(intent.qty, item.bQty);
const costP = item.isDynamic ? packs * Math.round(toPiastres(intent.price) / 2) : packs * item.pP;
const spareStr = spare > 0 ? ` · ${spare} ${item.bType} spare` : '';
return { text: `⏎ Add ${item.n} — ${intent.qty} ${item.bType} → ${packs} pack${packs === 1 ? '' : 's'}${spareStr} · ${formatPiastres(costP)} EGP`, ok: true };
};

const commit = (op) => {
const item = db.find(i => i.id === op.id);
if (!item) return { ok: false, reason: 'no-item' };

if (op.kind === 'edit') {
const entry = dashboardMap.get(op.id);
if (!entry) return { ok: false, reason: 'no-entry' };
let rawVal = op.val;
if (isNaN(rawVal) || rawVal < 0) rawVal = 0;
let clamped = false;
if (rawVal > MAX_QTY) { rawVal = MAX_QTY; clamped = true; }
let req = entry.req, packs = entry.packs, sp = entry.supplyPrice || 0, spare = 0;
if (op.mode === 'pack') packs = rawVal;
else if (op.mode === 'req') { req = rawVal; ({ packs, spare } = packInfo(req, item.bQty)); }
else if (op.mode === 'sp') sp = rawVal;
if (op.mode !== 'req') spare = Math.max(0, packs * item.bQty - req);
const costP = item.isDynamic ? packs * Math.round(toPiastres(sp) / 2) : packs * item.pP;
const cost = costP / 100;
entry.req = req; entry.packs = packs; entry.cost = cost; entry.supplyPrice = sp;
dashboardMap.set(op.id, entry);
syncCurrentOrder();
return { ok: true, item, req, packs, spare, cost, costP, clamped };
}

const req = op.req;
if (isNaN(req) || req <= 0 || req > MAX_QTY) return { ok: false, reason: 'invalid-qty' };
let sp = 0;
if (item.isDynamic) {
sp = op.sp;
if (isNaN(sp) || sp < 0) return { ok: false, reason: 'needs-price' };
}
const result = commitToCalc(op.id, req, sp, op.additive !== false);
if (!result) return { ok: false, reason: 'no-item' };
return { ok: true, ...result };
};

savedOrders.push({ id: Date.now().toString(), name: orderName, total: `${formatPiastres(totalP)} EGP`, items: Array.from(dashboardMap.entries()) });
showToast("Unsaved work moved to Unfinished", "save");
};

window.createNewOrder = () => {
if (currentOrderIndex === -1 && dashboardMap.size > 0) {
if (savedOrders.length >= 10) { showToast("Maximum 10 saved orders allowed — delete some first", "warning"); return; }
autoSaveUnfinished();
}
dashboardMap.clear(); currentOrderIndex = -1; saveState(); renderDashboard();
};

window.removeDashboardItem = (id) => {
const entry = dashboardMap.get(id);
if (!entry) return;
lastDeletedOrder = null;
lastDeletedItem = { id, entry, wasCurrentOrder: currentOrderIndex };
dashboardMap.delete(id);
syncCurrentOrder();
renderDashboard();
showUndoToast(`Removed ${entry.item.n}`, "delete");
};
window.clearDashboard = () => { dashboardMap.clear(); currentOrderIndex = -1; saveState(); renderDashboard(); };

window.saveAsOrder = () => {
if(dashboardMap.size === 0) return;
if (currentOrderIndex >= 0) {
syncCurrentOrder(); renderDashboard(); showToast("Order updated", "bookmark_added");
} else {
if(savedOrders.length >= 10) { showToast("Maximum 10 saved orders allowed", "warning"); return; }
const dateStr = `${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
savedOrders.push({ id: Date.now().toString(), name: `Order ${dateStr}`, total: els.dashTotal.textContent, items: Array.from(dashboardMap.entries()) });
currentOrderIndex = savedOrders.length - 1; saveState(); renderDashboard(); showToast("Order saved", "bookmark_added");
}
};

window.renameOrder = (idx, name) => {
const order = savedOrders[idx]; if(!order) return;
const clean = String(name || '').trim();
if(!clean) return;
order.name = clean.slice(0, 60);
saveState(); renderDashboard(); showToast("Order renamed", "edit");
};

window.duplicateOrder = (idx) => {
const order = savedOrders[idx]; if(!order) return;
if(savedOrders.length >= 10) { showToast("Maximum 10 saved orders allowed", "warning"); return; }
savedOrders.splice(idx + 1, 0, { id: Date.now().toString(), name: `${order.name} (Copy)`.slice(0, 60), total: order.total, items: order.items.map(([k, v]) => [k, { ...v }]) });
saveState(); renderDashboard(); showToast("Order duplicated", "content_copy");
};

window.loadOrder = (idx) => {
if (currentOrderIndex === -1 && dashboardMap.size > 0) {
if (savedOrders.length >= 10) { showToast("Maximum 10 saved orders allowed — delete some first", "warning"); return; }
autoSaveUnfinished();
}
const order = savedOrders[idx]; if(!order) return;
dashboardMap = new Map(order.items); currentOrderIndex = idx; saveState(); renderDashboard(); showToast(`Loaded ${order.name}`, "restore");
};

window.deleteOrder = (e, idx) => {
e.stopPropagation();
lastDeletedItem = null;
lastDeletedOrder = savedOrders[idx]; lastDeletedIndex = idx; savedOrders.splice(idx, 1);
if(currentOrderIndex === idx) { currentOrderIndex = -1; dashboardMap.clear(); }
else if (currentOrderIndex > idx) { currentOrderIndex--; }
saveState(); renderDashboard(); showUndoToast(`Order deleted`, "delete");
};

window.undoDelete = () => {
if(lastDeletedItem) {
const { id, entry, wasCurrentOrder } = lastDeletedItem;
if (wasCurrentOrder === currentOrderIndex) { dashboardMap.set(id, entry); syncCurrentOrder(); renderDashboard(); showToast("Item restored", "restore"); }
lastDeletedItem = null;
} else if(lastDeletedOrder) {
savedOrders.splice(lastDeletedIndex, 0, lastDeletedOrder);
if (currentOrderIndex !== -1 && currentOrderIndex >= lastDeletedIndex) { currentOrderIndex++; }
lastDeletedOrder = null; saveState(); renderDashboard(); showToast("Order restored", "restore");
} else { return; }
const toastBtn = document.querySelector('.undo-toast button'); if(toastBtn && toastBtn.parentElement) toastBtn.parentElement.remove();
};

window.exportDashboardText = () => {
const items = Array.from(dashboardMap.values()); if(!items.length) return;
let txt = `${els.dashTitleText.textContent}:\n\n`;
items.forEach(c => {
const dpInfo = c.item.isDynamic ? ` [Supply Price: ${c.supplyPrice}]` : '';
txt += `- ${c.item.n}: Req ${c.req} ${c.item.bType} -> ${c.packs} Packs${dpInfo} = ${formatPiastres(toPiastres(c.cost))} EGP\n`;
});
txt += `\nTotal: ${els.dashTotal.textContent}`;
copyTextToClipboard(txt).then(ok => showToast(ok ? "Copied to clipboard" : "Copy failed — select text manually", ok ? "content_copy" : "warning"));
};

const triggerDownload = (blob, filename) => {
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url; a.download = filename; a.style.display = 'none';
document.body.appendChild(a);
a.click();
setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
};

window.downloadDashboard = () => {
if(dashboardMap.size === 0) return;
const blob = new Blob([JSON.stringify({ title: els.dashTitleText.textContent, items: Array.from(dashboardMap.entries()) }, null, 2)], { type: "application/json" });
triggerDownload(blob, `LX_Calc_${Date.now()}.json`);
showToast("Download started", "download_done");
};

const csvEscape = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
window.downloadDashboardCSV = () => {
const items = Array.from(dashboardMap.values()); if(!items.length) return;
const header = ['Name','Tag','Source','Unit','Requested','Base Unit','Packs','Price per Pack (EGP)','Supply Price (EGP)','Cost (EGP)'];
const rows = items.map(c => [
c.item.n, c.item.t, c.item.s, c.item.u, c.req, c.item.bType, c.packs,
c.item.isDynamic ? '' : c.item.p.toFixed(2),
c.item.isDynamic ? c.supplyPrice.toFixed(2) : '',
formatPiastres(toPiastres(c.cost))
]);
const csv = [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
triggerDownload(blob, `LX_Calc_${Date.now()}.csv`);
showToast("CSV download started", "download_done");
};

els.fileUp.addEventListener('change', (e) => {
const file = e.target.files[0]; if(!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
try {
const data = JSON.parse(ev.target.result);
if(data.items && Array.isArray(data.items)) {
const validItems = data.items.filter(entry => Array.isArray(entry) && entry.length === 2 && entry[0] && entry[1] && entry[1].item);
dashboardMap = new Map(migrateEntries(validItems)); currentOrderIndex = -1; saveState(); renderDashboard(); showToast("Calculation loaded from file", "file_download_done");
} else { showToast("Invalid file format", "warning"); }
} catch(err) { showToast("Invalid file format", "warning"); }
}; reader.readAsText(file); els.fileUp.value = '';
});

const renderCmdk = (q) => {
const raw = q.trim();
cmdkParsedQty = null;
cmdkPaneFocused = false;
cmdkPaneIndex = 0;

let searchStr = raw;
const qtyMatch = raw.match(/^(.+?)\s+[x*×]\s*(\d+(?:\.\d+)?)$/i);
if(qtyMatch && qtyMatch[1].trim()) { searchStr = qtyMatch[1].trim(); cmdkParsedQty = parseFloat(qtyMatch[2]); }

const qStr = normalizeSearchText(searchStr);
cmdkItems = [];
baseCommands().filter(c => !qStr || c.title.toLowerCase().includes(qStr)).forEach(c => cmdkItems.push({ type: 'command', ...c }));
savedOrders.forEach((o, idx) => {
if(!qStr || o.name.toLowerCase().includes(qStr)) {
cmdkItems.push({ type: 'order', idx, icon: 'bookmark', title: o.name, sub: o.total, actions: buildOrderActions(idx) });
}
});
if(qStr) {
const qTokens = qStr.split(/\s+/).filter(Boolean);
db.filter(item => qTokens.every(tk => { const aliasTk = resolveAliasToken(tk); return item.searchStr.includes(tk) || (aliasTk !== tk && item.searchStr.includes(aliasTk)); })).slice(0, 8).forEach(m => {
cmdkItems.push({
type: 'medicine', id: m.id, icon: m.icon, title: m.n + (m.t ? ' ' + m.t : ''),
sub: m.isDynamic ? '50% Supply Price' : `${m.p.toFixed(2)} EGP`,
dynamic: m.isDynamic, actions: buildMedicineActions(m)
});
});
}
cmdkActiveIndex = cmdkItems.length ? 0 : -1;
paintCmdk();
};

renderCmdk(cmdkEls.input.value);
cmdkActiveIndex = Math.min(wasActive, cmdkItems.length - 1);
cmdkPaneFocused = wasPane; cmdkPaneIndex = wasIdx;
paintCmdk();
};

window.updatePanePreview = (id) => {
const med = db.find(d => d.id === id);
const preview = document.getElementById('panePreview');
if(!med || !preview) return;
const qtyEl = document.getElementById('paneQty');
const qty = qtyEl ? parseFloat(qtyEl.value) : NaN;
if(isNaN(qty) || qty <= 0) { preview.textContent = 'Enter a quantity to preview cost'; return; }
const req = globalAddMode === 'pack' ? qty * med.bQty : qty;
const { packs, spare } = packInfo(req, med.bQty);
const spareMsg = spare > 0 ? ` (${spare} ${med.bType} spare)` : '';
if(med.isDynamic) {
const spEl = document.getElementById('paneSp');
const sp = spEl ? parseFloat(spEl.value) : NaN;
if(isNaN(sp) || sp < 0) { preview.textContent = `${packs} pack${packs === 1 ? '' : 's'} (${req} ${med.bType})${spareMsg} — enter supply price`; return; }
const costP = packs * Math.round(toPiastres(sp) / 2);
preview.textContent = `${packs} pack${packs === 1 ? '' : 's'} (${req} ${med.bType})${spareMsg} → ${formatPiastres(costP)} EGP`;
} else {
const costP = packs * med.pP;
preview.textContent = `${packs} pack${packs === 1 ? '' : 's'} (${req} ${med.bType})${spareMsg} → ${formatPiastres(costP)} EGP`;
}
};

const codeToLabel = (code) => {
if(code.startsWith('Key')) return code.slice(3);
if(code.startsWith('Digit')) return code.slice(5);
if(code === 'Space') return 'Space';
return code;
};
const comboFromEvent = (e) => {
const parts = [];
if(e.ctrlKey || e.metaKey) parts.push(MOD_KEY);
if(e.altKey) parts.push('⌥');
if(e.shiftKey) parts.push('⇧');
parts.push(codeToLabel(e.code));
return parts.join('');
};

cmdkPaneFocused = false;
cmdkPaneIndex = 0;
paintCmdk();
cmdkEls.input.focus({ preventScroll: true });
};

const runShortcutForActiveItem = (e) => {
const combo = comboFromEvent(e);
const item = cmdkItems[cmdkActiveIndex];
const match = item && item.actions && item.actions.find(a => a.shortcut === combo);
if(match) { e.preventDefault(); match.run(); return true; }
return false;
};

window.paneKeydown = (e, idx) => {
if(e.key === 'ArrowDown') {
e.preventDefault();
const navEls = Array.from(cmdkEls.pane.querySelectorAll('.pane-nav-item'));
cmdkPaneIndex = Math.min(idx + 1, navEls.length - 1);
const next = navEls[cmdkPaneIndex];
if(next) next.focus({ preventScroll: true });
return;
}
if(e.key === 'ArrowUp') {
e.preventDefault();
const navEls = Array.from(cmdkEls.pane.querySelectorAll('.pane-nav-item'));
cmdkPaneIndex = Math.max(idx - 1, 0);
const prev = navEls[cmdkPaneIndex];
if(prev) prev.focus({ preventScroll: true });
return;
}
if(e.key === 'ArrowLeft') { e.preventDefault(); exitPaneToList(); return; }
if(e.key === 'Escape') { e.preventDefault(); exitPaneToList(); return; }
if(e.key === 'Enter') {
const target = e.currentTarget;
if(target.tagName === 'INPUT') {
e.preventDefault();
const item = cmdkItems[cmdkActiveIndex];
if(item && item.actions && item.actions[0]) item.actions[0].run();
return;
}
if(target.getAttribute('role') === 'button') { e.preventDefault(); target.click(); return; }
return;
}
runShortcutForActiveItem(e);
};

cmdkEls.input.addEventListener('input', () => { cmdkLastQuery = cmdkEls.input.value; renderCmdk(cmdkLastQuery); });
cmdkEls.overlay.addEventListener('click', e => { if(e.target === cmdkEls.overlay) closeCmdk(); });
cmdkEls.input.addEventListener('keydown', e => {
if(e.key === 'ArrowDown') {
e.preventDefault();
if(cmdkItems.length) { cmdkActiveIndex = Math.min(cmdkActiveIndex + 1, cmdkItems.length - 1); cmdkPaneFocused = false; cmdkPaneIndex = 0; paintCmdk(); }
return;
}
if(e.key === 'ArrowUp') {
e.preventDefault();
if(cmdkItems.length) { cmdkActiveIndex = Math.max(cmdkActiveIndex - 1, 0); cmdkPaneFocused = false; cmdkPaneIndex = 0; paintCmdk(); }
return;
}
if(e.key === 'ArrowRight') {
const atEnd = cmdkEls.input.selectionStart === cmdkEls.input.value.length && cmdkEls.input.selectionEnd === cmdkEls.input.value.length;
if(!atEnd) return;
const item = cmdkItems[cmdkActiveIndex];
if(item && item.actions && item.actions.length) { e.preventDefault(); cmdkPaneFocused = true; cmdkPaneIndex = 0; paintCmdk(); }
return;
}
if(e.key === 'Enter') {
e.preventDefault();
const item = cmdkItems[cmdkActiveIndex];
if(item && item.actions && item.actions.length) item.actions[0].run();
return;
}
runShortcutForActiveItem(e);
});

document.addEventListener('keydown', e => {
if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK') {
e.preventDefault();
if(cmdkEls.overlay.classList.contains('active')) closeCmdk(); else openCmdk();
return;
}
if(cmdkEls.overlay.classList.contains('active')) {
if(e.key === 'Escape') { e.preventDefault(); if(cmdkPaneFocused) { cmdkPaneFocused = false; paintCmdk(); } else closeCmdk(); }
return;
}
if (e.code === 'Slash' && document.activeElement !== els.in && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'SELECT') {
e.preventDefault(); switchView('search'); els.in.focus({ preventScroll: true }); return;
}
if(e.key === 'Escape') {
if(quickLinksOpenId) { closeQuickLinks(); return; }
if(els.modal.classList.contains('active')) { closeModal(); return; }
if(document.activeElement === els.in) { els.in.blur(); return; }
return;
}
if(activeView === 'search' && document.activeElement === els.in) {
if(e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
else if(e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
else if(e.key === 'PageDown') { e.preventDefault(); moveSelection(10); }
else if(e.key === 'PageUp') { e.preventDefault(); moveSelection(-10); }
else if(e.key === 'Home') { e.preventDefault(); selectFirst(); }
else if(e.key === 'End') { e.preventDefault(); selectLast(); }
else if(e.key === 'Enter' && selectionIndex >= 0 && currentResults[selectionIndex]) { e.preventDefault(); openDetails(currentResults[selectionIndex].id); }
}
});

if (!isMacPlatform) {
const modSymbolEl = document.getElementById('cmdkModSymbol');
if (modSymbolEl) modSymbolEl.textContent = MOD_KEY;
if (els.in) els.in.placeholder = els.in.placeholder.replace('⌘K', `${MOD_KEY}K`);
}

const runSelfTest = () => {
const results = [];
const assert = (name, cond) => results.push({ name, pass: !!cond });

const p1 = packInfo(310, 300);
assert('pack math: 310/300 rounds up to 2 packs', p1.packs === 2);
assert('pack math: 310/300 leaves 290 spare', p1.spare === 290);
const p2 = packInfo(300, 300);
assert('pack math: exact multiple has no spare', p2.packs === 1 && p2.spare === 0);
const p3 = packInfo(0, 300);
assert('pack math: zero request needs zero packs', p3.packs === 0 && p3.spare === 0);
const p4 = packInfo(45, 30);
assert('pack math: 45/30 rounds up to 2 packs with 15 spare', p4.packs === 2 && p4.spare === 15);
const p5 = packInfo(5, undefined);
assert('pack math: missing bQty falls back to 1 (no spare)', p5.packs === 5 && p5.spare === 0);

assert('piastres: 11.5 EGP -> 1150', toPiastres(11.5) === 1150);
assert('piastres: rounds fractional cents', toPiastres(2.505) === 251 || toPiastres(2.505) === 250);
assert('piastres: format back to 2dp string', formatPiastres(1150) === '11.50');
let sumP = 0; [1150, 2700, 375].forEach(v => sumP += v);
assert('piastres: integer sums have no float drift', formatPiastres(sumP) === '42.25');

(() => {
const dashSnapshot = dashboardMap, orderSnapshot = currentOrderIndex;
dashboardMap = new Map();
currentOrderIndex = -1;
const normalItem = db.find(d => d.n === 'Concor 5' && !d.t);
const dynamicItem = db.find(d => d.isDynamic);
const r1 = commitToCalc(normalItem.id, 45, 0, false);
assert('commitToCalc: packs/spare come from packInfo (45/30)', r1.packs === 2 && r1.spare === 15);
assert('commitToCalc: non-dynamic cost is packs * pack price', r1.cost === +(r1.packs * normalItem.p).toFixed(2));
const r2 = commitToCalc(normalItem.id, 5, 0, true);
assert('commitToCalc: additive=true sums req onto the existing entry', dashboardMap.get(normalItem.id).req === 50);
const r3 = commitToCalc(dynamicItem.id, 2, 100, true);
assert('commitToCalc: dp item cost is 50% of supply price x packs', r3.cost === 100);
assert('commitToCalc: dashboardMap holds exactly the two committed ids', dashboardMap.size === 2);
dashboardMap = dashSnapshot;
currentOrderIndex = orderSnapshot;
})();

const qtyRe = /^(.+?)\s+[x*×]\s*(\d+(?:\.\d+)?)$/i;
assert('qty parse: "novomix 30" does not mis-fire', !qtyRe.test('novomix 30'));
assert('qty parse: "concor 5 x 3" parses to qty 3', (() => { const m = 'concor 5 x 3'.match(qtyRe); return m && m[2] === '3'; })());
assert('qty parse: "amaryl * 2" (asterisk) parses', (() => { const m = 'amaryl * 2'.match(qtyRe); return m && m[2] === '2'; })());
assert('qty parse: "amaryl x2" (no space before qty) parses', (() => { const m = 'amaryl x2'.match(qtyRe); return m && m[2] === '2'; })());

const parseCommandTable = [
['concor 5', 'concor 5', null, null, null],
['concor 5 x30', 'concor 5', 30, 'default', null],
['concor 5x30', 'concor 5', 30, 'default', null],
['concor 5 x 30', 'concor 5', 30, 'default', null],
['amaryl * 2', 'amaryl', 2, 'default', null],
['amaryl ×2', 'amaryl', 2, 'default', null],
['concor 5 x2p', 'concor 5', 2, 'pack', null],
['concor 5 x30u', 'concor 5', 30, 'unit', null],
['atozet 10 / 20', 'atozet 10/20', null, null, null],
['atozet 10 / 20 x3', 'atozet 10/20', 3, 'default', null],
['exforge hct 160 / 5 /12.5 x2', 'exforge hct 160/5/12.5', 2, 'default', null],
['anoro @450 x2', 'anoro', 2, 'default', 450],
['anoro x2 @450', 'anoro', 2, 'default', 450],
['novomix 30', 'novomix 30', null, null, null],
['تريسيبا', 'تريسيبا', null, null, null],
['concor ٥ x٣٠', 'concor 5', 30, 'default', null],
['concor 5 x', 'concor 5 x', null, null, null],
['concor 5 x0', 'concor 5', 'reject', null, null],
['concor 5 x-3', 'concor 5 x-3', null, null, null],
['x30', 'x30', null, null, null],
['concor 5 x1000000', 'concor 5', 999999, 'default', null],
['', '', null, null, null]
];
parseCommandTable.forEach(([input, eQuery, eQty, eUnit, ePrice]) => {
const r = parseCommand(input);
const qtyOk = eQty === 'reject' ? (r.qtyInvalid === true && r.qty === null) : (r.qty === eQty);
assert(`parseCommand: ${JSON.stringify(input)}`, r.query === eQuery && qtyOk && r.unit === eUnit && r.price === ePrice);
});

assert('search normalize: tight slash matches spaced slash', normalizeSearchText('160/10') === normalizeSearchText('160 / 10'));
assert('search normalize: Arabic-Indic digits map to ASCII', normalizeDigits('٣٠') === '30');

assert('stable ids: deterministic across repeated calls', makeStableId('Concor', '5 mg Tab', 'شراء موحد') === makeStableId('Concor', '5 mg Tab', 'شراء موحد'));
const idSet = new Set(db.map(d => d.id));
assert(`stable ids: all ${db.length} db entries have unique ids`, idSet.size === db.length);

const migrated = migrateEntries([['old-random-id', { req: 5, packs: 1, cost: 10, supplyPrice: 0, item: { n: db[0].n, u: db[0].u, s: db[0].s, t: db[0].t } }]]);
assert('storage migration: old id remaps to current db id', migrated.length === 1 && migrated[0][0] === db[0].id);
assert('storage migration: drops entries with no matching item', migrateEntries([['x', { item: { n: 'nonexistent-item-xyz', u: '?', s: '?', t: '' } }]]).length === 0);
assert('storage migration: non-array input returns an empty array', Array.isArray(migrateEntries(null)) && migrateEntries(null).length === 0);
assert('storage migration: malformed entries are dropped without throwing', migrateEntries([['bad'], ['x', {}], ['y', { item: null }]]).length === 0);
assert('storage migration: kept entries carry the resolved db item', migrateEntries([['old-random-id', { req: 5, packs: 1, cost: 10, supplyPrice: 0, item: { n: db[0].n, u: db[0].u, s: db[0].s, t: db[0].t } }]])[0][1].item.id === db[0].id);

const tConcor = resolveTarget(parseCommand('concor 5'));
assert('resolveTarget: direct substring match finds an item', tConcor && tConcor.item.nLower.startsWith('concor'));
const tAlias = resolveTarget(parseCommand('glimepiride'));
assert('resolveTarget: generic-name alias resolves to the branded item', tAlias && tAlias.item.nLower.startsWith('amaryl'));
assert('resolveTarget: no match returns null', resolveTarget(parseCommand('zzznonexistentdrugxyz')) === null);
assert('resolveTarget: empty query returns null', resolveTarget(parseCommand('')) === null);

const pvIdle = preview(parseCommand(''), null);
assert('preview: idle hint shown for empty query', pvIdle.text.includes('Type a medicine name'));
const pvNoMatch = preview(parseCommand('zzznonexistentdrugxyz'), null);
assert('preview: no-match hint names the query', pvNoMatch.text.includes('No match for'));
const concorItem = db.find(d => d.n === 'Concor 5' && !d.t);
const pvSearch = preview(parseCommand('concor 5'), { item: concorItem });
assert('preview: searching (no qty) shows name, unit and price', pvSearch.ok && pvSearch.text.includes(concorItem.n) && pvSearch.text.includes(concorItem.u));
const pvArmed = preview(parseCommand('concor 5 x30'), { item: concorItem });
assert('preview: armed-with-qty shows pack math and total', pvArmed.ok && pvArmed.text.includes('1 pack') && pvArmed.text.includes(formatPiastres(concorItem.pP)));
const pvSpare = preview(parseCommand('concor 5 x45'), { item: concorItem });
assert('preview: spare quantity is called out', pvSpare.text.includes('spare'));
const anoroItem = db.find(d => d.isDynamic);
const pvNeedsPrice = preview(parseCommand(`${anoroItem.n} x2`), { item: anoroItem });
assert('preview: dp item with no price prompts for one', !pvNeedsPrice.ok && pvNeedsPrice.text.includes('supply price'));
const pvInvalid = preview(parseCommand('concor 5 x0'), { item: concorItem });
assert('preview: rejected qty shows the must-be-positive hint', pvInvalid.text === 'Quantity must be greater than 0');

(() => {
const dashSnapshot = dashboardMap;
dashboardMap = new Map();
const normalItem = db.find(d => d.n === 'Concor 5' && !d.t);
const dynamicItem = db.find(d => d.isDynamic);
const badQty = commit({ kind: 'add', id: normalItem.id, req: 0, sp: 0, additive: true });
assert('commit: add rejects a zero quantity without mutating', badQty.ok === false && badQty.reason === 'invalid-qty' && dashboardMap.size === 0);
const needsPrice = commit({ kind: 'add', id: dynamicItem.id, req: 2, sp: NaN, additive: true });
assert('commit: add on a dp item with no price asks for one', needsPrice.ok === false && needsPrice.reason === 'needs-price' && dashboardMap.size === 0);
const added = commit({ kind: 'add', id: normalItem.id, req: 45, sp: 0, additive: true });
assert('commit: add path matches commitToCalc\'s pack math', added.ok && added.packs === 2 && added.spare === 15 && dashboardMap.size === 1);
const editedReq = commit({ kind: 'edit', id: normalItem.id, val: 61, mode: 'req' });
assert('commit: edit(req) recomputes packs from the new total', editedReq.ok && editedReq.packs === 3 && dashboardMap.get(normalItem.id).req === 61);
const editedPack = commit({ kind: 'edit', id: normalItem.id, val: 5, mode: 'pack' });
assert('commit: edit(pack) sets packs directly and recomputes cost', editedPack.ok && editedPack.packs === 5 && editedPack.costP === 5 * normalItem.pP);
const clampedEdit = commit({ kind: 'edit', id: normalItem.id, val: 5000000, mode: 'req' });
assert('commit: edit clamps an over-max value and reports it', clampedEdit.ok && clampedEdit.clamped === true && clampedEdit.req === MAX_QTY);
dashboardMap = dashSnapshot;
})();

(() => {
const savedVal = els.in.value;

els.in.value = 'concor';
renderSearch();
const domCount = els.res.querySelectorAll('.card').length;
assert('reconciler: every match renders, no chunk cap', domCount === currentResults.length && domCount > 1);

const firstId = currentResults[0].id;
const firstNode = document.getElementById(`card-${firstId}`);
els.in.value = 'concor 5';
renderSearch();
const stillThere = currentResults.some(r => r.id === firstId);
assert('reconciler: a row still in the result set keeps its DOM node', !stillThere || document.getElementById(`card-${firstId}`) === firstNode);

els.in.value = 'concor';
renderSearch();
assert('selection: renderSearch resets selection to none', selectionIndex === -1 && !els.in.hasAttribute('aria-activedescendant'));

els.in.focus();
const activeBefore = document.activeElement;
moveSelection(1);
assert('selection: moving down from none selects the first row', selectionIndex === 0);
assert('focus: moving selection never changes document.activeElement', document.activeElement === activeBefore);
moveSelection(-1);
assert('selection: moving up from the first row wraps to the last', selectionIndex === currentResults.length - 1);
moveSelection(1);
assert('selection: moving down from the last row wraps to the first', selectionIndex === 0);
const selRow = document.getElementById(`card-${currentResults[0].id}`);
assert('selection: aria-activedescendant tracks the selected row', els.in.getAttribute('aria-activedescendant') === selRow.id);
assert('selection: selected row is aria-selected and gets the visual class', selRow.getAttribute('aria-selected') === 'true' && selRow.classList.contains('focused'));
selectLast();
assert('selection: End-equivalent selects the last row', selectionIndex === currentResults.length - 1);
selectFirst();
assert('selection: Home-equivalent selects the first row', selectionIndex === 0);
assert('a11y: results list is a listbox of options', els.res.getAttribute('role') === 'listbox' && selRow.getAttribute('role') === 'option');
assert('a11y: omnibar exposes role=combobox', els.in.getAttribute('role') === 'combobox');

els.in.value = savedVal;
renderSearch();
})();

const passCount = results.filter(r => r.pass).length;
console.group(`%cLX self-test: ${passCount}/${results.length} passed`, `color:${passCount === results.length ? '#3ddc84' : '#ff5c5c'}; font-weight:bold;`);
results.forEach(r => console[r.pass ? 'log' : 'error'](`${r.pass ? '✓' : '✗'} ${r.name}`));
console.groupEnd();
return results;
};
if (new URLSearchParams(location.search).get('selftest') === '1') runSelfTest();

const ICON_CODEPOINTS = {
add: '\ue145', air: '\uefd8', bolt: '\uea0b', bookmark: '\ue8e7', bookmark_added: '\ue599',
brightness_auto: '\ue1ab', calculate: '\uea5f', check: '\ue668', check_circle: '\uf0be',
chevron_right: '\ue5cc', clear_all: '\ue0b8', close: '\ue5cd', content_copy: '\ue14d',
contrast: '\ueb37', cruelty_free: '\ue799', dark_mode: '\ue51c', data_usage: '\ueff2',
delete: '\ue92e', delete_sweep: '\ue16c', download: '\uf090', download_done: '\uf091',
edit: '\uf097', expand_more: '\ue5cf', explore: '\ue87a', file_download_done: '\uf091',
grid_on: '\ue3ec', image: '\ue3f4', inventory_2: '\ue1a1', light_mode: '\ue518', lock: '\ue899',
medical_services: '\uf109', medication: '\uf033', open_in_new: '\ue89e', pill: '\ue11f',
psychology: '\uea4a', restore: '\ue8b3', save: '\ue161', search: '\uef7a', settings: '\ue8b8',
straighten: '\ue41c', stream: '\ue9e9', swap_vert: '\ue8d5', syringe: '\ue133',
travel_explore: '\ue2db', upload: '\uf09b', vaccines: '\ue138', warning: '\uf083'
};
const LIGATURE_NAME_RE = /^[a-z][a-z_]*$/;
const applyIconCodepoint = (el) => {
if (!el || el.nodeType !== 1 || !el.classList || !el.classList.contains('material-symbols-rounded')) return;
const text = el.textContent;
if (LIGATURE_NAME_RE.test(text) && ICON_CODEPOINTS[text]) el.textContent = ICON_CODEPOINTS[text];
};
const applyIconCodepoints = (node) => {
if (!node) return;
if (node.nodeType === 3) { applyIconCodepoint(node.parentElement); return; }
if (node.nodeType !== 1) return;
applyIconCodepoint(node);
if (node.querySelectorAll) node.querySelectorAll('.material-symbols-rounded').forEach(applyIconCodepoint);
};
applyIconCodepoints(document.body);
new MutationObserver((mutations) => {
mutations.forEach(m => m.addedNodes.forEach(applyIconCodepoints));
}).observe(document.body, { childList: true, subtree: true });

loadState(); renderSearch(); renderDashboard();
</script>
<script>
(function(){
  if(window.parent === window) return;
  function ready(){
    window.parent.postMessage({ t:'lx:ready', title:document.title }, '*');
    var last = document.title;
    var titleEl = document.querySelector('title');
    if(!titleEl) return;
    new MutationObserver(function(){
      if(document.title !== last){
        last = document.title;
        window.parent.postMessage({ t:'lx:title', title:last }, '*');
      }
    }).observe(titleEl, { childList:true });
  }
  if(document.readyState === 'complete') ready();
  else window.addEventListener('load', ready);
})();
</script>
<script>
(function(){
  if(window.parent === window) return;
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || d.t !== 'lx:theme') return;
    var mode = d.mode;
    if(mode !== 'light' && mode !== 'dark' && mode !== 'system') return;
    document.documentElement.setAttribute('data-theme-mode', mode);
    try { localStorage.setItem('lx_theme_mode', mode); } catch(err){}
    applyEffectiveTheme();
  });
})();
</script>
